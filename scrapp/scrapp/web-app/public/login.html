<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scrapp 3D studio: sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root{--ink:#5C3A26;--ink-soft:#694A47;--paper:#F1E7D3;--card:#FFF0DE;--teal:#96C1C5;--teal-deep:#4E8288;--danger:#B5483D}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--paper);color:var(--ink);font:600 16px/1.45 Nunito,system-ui,sans-serif;
    background-image:radial-gradient(rgba(105,74,71,.05) 1px,transparent 1px);background-size:7px 7px}
  .box{width:min(420px,100%);background:var(--card);border-radius:28px;padding:28px 26px 24px;
    box-shadow:-3px -3px 8px rgba(255,255,255,.7),4px 5px 12px rgba(105,74,71,.16)}
  .mark{font:400 56px/1 Yellowtail,cursive;text-align:center}
  .tag{text-align:center;color:var(--ink-soft);margin:2px 0 18px;font-weight:700}
  h1{font:400 28px/1.05 Anton,sans-serif;letter-spacing:.6px;margin:0 0 14px}
  label{display:block;font-weight:800;font-size:14px;margin:10px 0 4px}
  input{width:100%;border:2px solid rgba(105,74,71,.35);border-radius:16px;background:#fff;padding:12px 14px;font:700 17px Nunito;color:var(--ink)}
  input:focus{outline:3px solid rgba(150,193,197,.7);border-color:var(--teal-deep)}
  button{margin-top:18px;width:100%;appearance:none;border:0;border-radius:999px;padding:13px 20px;font:800 17px Nunito;color:var(--ink);background:var(--teal);cursor:pointer;box-shadow:0 3px 0 rgba(105,74,71,.22)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(105,74,71,.22)}
  button[disabled]{opacity:.55;cursor:default}
  .err{color:var(--danger);font-weight:800;min-height:1.4em;margin:12px 0 0;text-align:center}
  .help{color:var(--ink-soft);font-size:14px;text-align:center;margin:16px 0 0}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="mark">Scrapp</div>
  <div class="tag">3D studio</div>
  <h1>SIGN IN</h1>
  <label for="u">Username or email</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
  <p class="help">Use the same account as the Scrapp app. New here? Create your account in the app first.</p>
</form>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  fetch('/api/auth/me').then((r) => { if (r.ok) location.replace('/'); }).catch(() => {});
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Sign-in failed.');
      location.replace('/');
    } catch (ex) { err.textContent = ex.message; go.disabled = false; go.textContent = 'Sign in'; }
  });
</script>
</body>
</html>
