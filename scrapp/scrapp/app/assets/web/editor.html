<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Scrapp collage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
      background: #F1E7D3 url("textures/paper_grain.png") repeat; background-size: 256px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #5C3A26; }
    canvas { display: block; }
    #title { position: fixed; left: 16px; top: 14px; font-weight: 800; font-size: 20px; letter-spacing: .02em;
      background: #FFF0DE; padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 0 #694A4733; display: none; }
    #brand { position: fixed; right: 16px; bottom: 12px; font-size: 13px; opacity: .7; display: none; }
    #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 16px; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="title"></div>
  <div id="brand">made with Scrapp</div>
  <div id="msg"></div>
  <script type="module" src="./editor.js"></script>
</body>
</html>
