name: scrapp
description: Scrapp - an AR scrapbook for Meta AI glasses.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  geolocator: ">=13.0.0 <16.0.0"
  geocoding: ">=3.0.0 <5.0.0"
  image_picker: ^1.1.2
  share_plus: ^10.1.0
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/textures/
    - assets/web/vendor/three/build/
    - assets/web/vendor/three/addons/controls/
    - assets/web/vendor/three/addons/loaders/
    - assets/web/vendor/three/addons/utils/
    - assets/web/vendor/three/addons/postprocessing/
    - assets/web/vendor/three/addons/shaders/
